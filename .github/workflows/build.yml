name: sandbox-runtime-build
on:
  push:
    branches: [ "arena/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run unit tests (Maven)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.m2"
          mvn -q -B --no-transfer-progress test -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2"
      - name: Build plugin jar (javac + gradle-cache libs)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/NicolasLasch/ZoneGuard zg
          (cd zg && git sparse-checkout set .gradle-home)
          mkdir -p classes sandbox/plugin
          VER=$(grep -m1 -oE '<version>[0-9.]+' pom.xml | grep -oE '[0-9.]+')
          sed -i "s/@project.version@/$VER/g" src/main/resources/plugin.yml
          CP=$(find zg/.gradle-home -name '*.jar' | grep -v sources | tr '\n' ':')
          javac --release 21 -nowarn -cp "$CP" -d classes $(find src/main/java -name '*.java')
          jar --create --file "sandbox/plugin/CoreMC-$VER.jar" -C classes . -C src/main/resources .
          cp "sandbox/plugin/CoreMC-$VER.jar" sandbox/plugin/CoreMC.jar
      - name: JLink minimal Java runtime
        run: |
          rm -rf sandbox/runtime; JH=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")
          "$JH/bin/jlink" --add-modules java.se,jdk.unsupported,jdk.crypto.ec,jdk.zipfs,jdk.security.auth,jdk.management,jdk.management.agent,jdk.naming.dns,jdk.jfr,jdk.xml.dom,jdk.net \
            --compress zip-9 --strip-debug --no-header-files --no-man-pages \
            --output sandbox/runtime/linux-x64
          sandbox/runtime/linux-x64/bin/java -version
      - name: Commit runtime + jar back to branch
        run: |
          git config user.name "arena-build"
          git config user.email "bot@users.noreply.github.com"
          git add -f sandbox/
          git commit -m "sandbox artifacts: jre + CoreMC jar"
          git push origin HEAD:${GITHUB_REF_NAME}
