name: build

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maven-build:
    name: Maven package + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate CoreMC ItemsAdder source pack
        run: python3 tools/validate_itemsadder_assets.py

      - name: Build with Maven (compile + JUnit tests + jar)
        run: |
          set -o pipefail
          mvn -B verify 2>&1 | tee mvn.log

      - name: Report final CoreMC JAR checksum
        run: |
          JAR=$(ls target/CoreMC-*.jar | head -1)
          echo "Final JAR: $JAR"
          stat -c 'Final JAR size: %s bytes' "$JAR"
          SHA=$(sha256sum "$JAR" | awk '{print $1}')
          echo "$SHA  $JAR"
          echo "::notice title=final-coremc-jar::${JAR} sha256=${SHA}"

      - name: Surface Maven failure lines as annotations
        if: failure()
        run: |
          # javac/junit failure lines from the tee'd log -> ::error:: so they
          # are readable through the checks annotations API as well
          {
            grep -E "(\[ERROR\]|BUILD FAILURE|COMPILATION ERROR)" mvn.log \
              | grep -v "To see the full stack trace" | grep -v "Re-run Maven using" \
              | grep -v "For more information about the errors" | grep -v "When encountering" \
              | grep -v "Please make sure" | head -n 12
            grep -E -A 4 "<<< (FAILURE|ERROR)!" mvn.log | grep -v "^--$" | head -n 30
          } | while IFS= read -r line; do
              echo "::error::${line:0:700}"
            done

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coremc-jar
          path: target/CoreMC-*.jar
          if-no-files-found: error

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
