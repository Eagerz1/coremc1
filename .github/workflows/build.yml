name: sandbox-runtime-build
on:
  push:
    branches: [ "arena/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build plugin jar (skip tests)
        run: |
          mvn -B -q package -DskipTests
          mkdir -p sandbox/plugin
          cp target/CoreMC-*.jar sandbox/plugin/CoreMC.jar
      - name: JLink minimal Java runtime
        run: |
          JH=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")
          "$JH/bin/jlink" --add-modules java.se,jdk.unsupported,jdk.crypto.ec \
            --compress zip-9 --strip-debug --no-header-files --no-man-pages \
            --output sandbox/runtime/linux-x64
          sandbox/runtime/linux-x64/bin/java -version
      - name: Commit runtime + jar back to branch
        run: |
          git config user.name "arena-build"
          git config user.email "bot@users.noreply.github.com"
          git add -f sandbox/
          git commit -m "sandbox artifacts: jre + CoreMC jar"
          git push origin HEAD:${GITHUB_REF_NAME}
