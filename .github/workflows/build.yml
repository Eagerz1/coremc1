name: sandbox-runtime-build
on:
  push:
    branches: [ "arena/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile, test and package plugin jar
        run: |
          set +e
          bash ci/build-and-test.sh 2>&1 | tee build-output.log
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" -ne 0 ]; then
            cp build-output.log sandbox/BUILD-FAIL.log
          else
            rm -f sandbox/BUILD-FAIL.log
            echo "build $GITHUB_SHA OK" > sandbox/BUILD-OK
          fi
          echo "$CODE" > .ci-exit-code
      - name: JLink minimal Java runtime
        if: success()
        run: |
          rm -rf sandbox/runtime; JH=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")
          "$JH/bin/jlink" --add-modules java.se,jdk.unsupported,jdk.crypto.ec,jdk.zipfs,jdk.security.auth,jdk.management,jdk.management.agent,jdk.naming.dns,jdk.jfr,jdk.xml.dom,jdk.net \
            --compress zip-9 --strip-debug --no-header-files --no-man-pages \
            --output sandbox/runtime/linux-x64
          sandbox/runtime/linux-x64/bin/java -version
      - name: Fetch Paper 1.21.11 server jar (sandbox has no papermc.io egress; CI does)
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          rm -f sandbox/PAPER-FAIL.log
          exec 2>&1
          mkdir -p sandbox
          rm -f sandbox/PAPER-FAIL.log
          DIAG=/tmp/paper-diag.log
          : > "$DIAG"
          OUT_DIR="sandbox"
          OK=""
          # Probe what the paper API looks like today (shape may have moved).
          for BASE in 'https://api.papermc.io/v2/projects/paper' 'https://fill.papermc.io/v3/projects/paper'; do
            CODE=$(curl -sSL -o /tmp/pb.json -w '%{http_code}' "$BASE" || true)
            echo "== $BASE -> $CODE" >> "$DIAG"
            head -c 300 /tmp/pb.json >> "$DIAG"; echo >> "$DIAG"
          done
          # Try a batch of direct download candidates (build 92 is known-good for 1.21.11).
          CANDS=(
            'https://api.papermc.io/v2/projects/paper/versions/1.21.11/builds/92/downloads/paper-1.21.11-92.jar'
            'https://api.papermc.io/v2/projects/paper/versions/1.21.11/builds/92/downloads/paper-1.21.11-92.jar?build=92'
            'https://dl.papermc.io/api/v2/projects/paper/versions/1.21.11/builds/92/downloads/paper-1.21.11-92.jar'
          )
          for URL in "${CANDS[@]}"; do
            CODE=$(curl -sSL -o "$OUT_DIR/paper-try.jar" -w '%{http_code}' "$URL" || true)
            SZ=$(stat -c%s "$OUT_DIR/paper-try.jar" 2>/dev/null || echo 0)
            echo "== $URL -> $CODE ($SZ bytes)" >> "$DIAG"
            if [ "$CODE" = "200" ] && [ "$SZ" -gt 10000000 ]; then
              mv "$OUT_DIR/paper-try.jar" "$OUT_DIR/paper-1.21.11-92.jar"
              echo "SUCCESS: $URL" >> "$DIAG"
              OK=1
              break
            fi
          done
          rm -f "$OUT_DIR/paper-try.jar"
          if [ -z "$OK" ]; then
            cp "$DIAG" sandbox/PAPER-FAIL.log
          else
            cat "$DIAG"
          fi
          exit 0
      - name: Commit artifacts + build status
        if: always()
        run: |
          git config user.name "arena-build"
          git config user.email "bot@users.noreply.github.com"
          git add -f sandbox/
          git commit -m "sandbox artifacts: jre + CoreMC jar + build status + paper" || true
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Propagate exit code
        if: always()
        run: exit "$(cat .ci-exit-code 2>/dev/null || echo 0)"
