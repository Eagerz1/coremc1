name: build

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maven-build:
    name: Maven package + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build with Maven (compile + JUnit tests + jar)
        run: mvn -B verify

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coremc-jar
          path: target/CoreMC-*.jar
          if-no-files-found: error

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
