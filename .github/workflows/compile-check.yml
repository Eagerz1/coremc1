# Fast feedback loop: compiles + runs unit tests only (no jlink/paper/artifacts).
# The full sandbox-runtime-build workflow still runs in parallel and produces
# the runnable jar; this one just answers "does it compile" as quickly as
# possible, with the Maven dependency cache warm after the first run.
name: compile-check

on:
  push:
    branches: ['arena/**']
    paths: ['src/**', 'pom.xml', '.github/workflows/compile-check.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile + unit tests
        run: mvn -B -Dorg.slf4j.simpleLogger.defaultLogLevel=warn verify
