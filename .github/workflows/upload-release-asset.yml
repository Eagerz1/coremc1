# One-shot helper: attach a build artifact to an existing GitHub release.
# Used when the publishing environment cannot reach uploads.github.com directly.
# The workflow runs on GitHub-hosted infrastructure (full network access).
#
# Usage: runs automatically when this file is pushed (push trigger), using the
# defaults below; or via workflow_dispatch with explicit inputs once the file
# exists on the repository's default branch.
name: upload-release-asset

on:
  push:
    branches: ['arena/01a0867a-coremc1']
    paths: ['.github/workflows/upload-release-asset.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the asset to (must already exist)'
        required: true
        type: string
      source_ref:
        description: 'Branch, tag or SHA to fetch the jar from'
        required: true
        type: string
      jar_path:
        description: 'Path of the jar within the source ref'
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch jar from source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || 'arena/01a0867a-coremc1' }}
          sparse-checkout: ${{ inputs.jar_path || 'sandbox/plugin/CoreMC-0.11.0.jar' }}
          sparse-checkout-cone-mode: false

      - name: Verify jar
        run: |
          JAR="${{ inputs.jar_path || 'sandbox/plugin/CoreMC-0.11.0.jar' }}"
          ls -l "$JAR"
          unzip -p "$JAR" plugin.yml | head -n 6

      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag || 'v0.11.0' }}" \
            "${{ inputs.jar_path || 'sandbox/plugin/CoreMC-0.11.0.jar' }}" --clobber
