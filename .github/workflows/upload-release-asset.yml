# Manual helper: build the plugin at a chosen ref and attach the jar to
# an existing GitHub release. Runs on GitHub-hosted infrastructure, so the
# jar is built fresh from source (target/, never committed artifacts).
#
# Run from the Actions tab -> "upload-release-asset" -> Run workflow.
name: upload-release-asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the asset to (must already exist)'
        required: true
        type: string
        default: 'v0.11.0'
      source_ref:
        description: 'Branch, tag or SHA to build from'
        required: true
        type: string
        default: 'main'

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build plugin jar
        run: mvn -B package

      - name: Verify jar
        run: |
          JAR=$(ls target/CoreMC-[0-9]*.jar | head -1)
          ls -l "$JAR"
          unzip -p "$JAR" plugin.yml | head -n 6

      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls target/CoreMC-[0-9]*.jar | head -1)
          gh release upload "${{ inputs.tag }}" "$JAR" --clobber
