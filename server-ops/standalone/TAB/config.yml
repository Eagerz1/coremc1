# Merge into plugins/TAB/config.yml generated by YOUR version of TAB.
# Installed on standalone Paper only. No TAB scoreboard and no TAB bossbar:
# CoreMC owns /hud and the Core Hour bossbar.
header-footer:
  enabled: true
  designs:
    default:
      header:
        - "&8&m--------------------------------"
        - "&b&lCOREMC &8| &fSKYBLOCK"
        - "&7Season One &8- &fBuild Your Legacy"
        - " "
      footer:
        - " "
        - "&7Online: &f%online%  &8| &7Ping: &f%ping%ms"
        - "&7/quests &8- &7/is &8- &7/store"
        - "&8&m--------------------------------"
tablist-name-formatting:
  enabled: true
scoreboard-teams:
  enabled: false # CoreMC allocates per-player scoreboards. Test separately before enabling nametag teams.
playerlist-objective:
  enabled: false
belowname-objective:
  enabled: false
bossbar:
  enabled: false
scoreboard:
  enabled: false
layout:
  enabled: false
global-playerlist:
  enabled: false
# Do not copy proxy-only TAB options onto a backend. Keep the defaults
# for other TAB keys from the version actually installed.
