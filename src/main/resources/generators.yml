# ============================================================
#  CoreMC — generators.yml
#  The /gens progression: generators are bought with coins,
#  placed on your island, stacked, upgraded tier by tier and
#  paid out automatically while you play.
#
#  Everything below is data — names, blocks, prices, output,
#  intervals, island requirements, caps and the upgrade path
#  can all be re-balanced freely. A broken file disables the
#  generator system with one loud log line, never the plugin.
#
#  Per generator:
#    name                    display name (rendered in small caps)
#    tier                    1-based, unique, defines the menu order
#    color                   & colour code of the tier
#    block                   the block placed in the world
#    icon                    optional menu icon (defaults to block)
#    price                   purchase price in coins
#    interval                seconds between payouts
#    value                   coins produced per payout, per generator
#    output.material         item pushed into an adjacent container
#    output.amount           how many per payout, per generator
#    required-island-points  island points needed to unlock it
#    max-placed              how many of it one island may place
#    upgrade.to              the next generator id
#    upgrade.cost            coins to upgrade ONE generator
#                            (a stack of 8 costs 8 x this)
# ============================================================

settings:
  # How many generators may share one block (sneak-click to stack).
  max-stack: 64
  # How many generators one island may have placed in total.
  max-per-island: 64
  # Generators only run while an island member is online.
  require-online: true
  # Also push the physical output into a container touching the
  # generator (chest, barrel, hopper...). Coins are always paid.
  produce-items: true
  # Floating "8x ɪʀᴏɴ ɢᴇɴᴇʀᴀᴛᴏʀ" labels above placed generators.
  holograms: true

generators:

  cobblestone:
    name: "Cobblestone Generator"
    tier: 1
    color: "&7"
    block: COBBLESTONE
    price: 1000
    interval: 60
    value: 50
    output:
      material: COBBLESTONE
      amount: 8
    required-island-points: 0
    max-placed: 32
    upgrade:
      to: coal
      cost: 5000

