# ============================================================
#  CoreMC — messages
#  Standard Minecraft & colour codes. {placeholders} are filled by
#  the plugin. The bundled defaults in the jar act as a fallback:
#  keys missing from this file fall back to them, so you can delete
#  lines you have not customised.
# ============================================================

prefix: "&b&lCOREMC >>> &f"

