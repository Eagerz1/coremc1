# ============================================================
#  CoreMC — messages
#  Standard Minecraft & colour codes. {placeholders} are filled by
#  the plugin. The bundled defaults in the jar act as a fallback:
#  keys missing from this file fall back to them, so you can delete
#  lines you have not customised.
# ============================================================

prefix: "&b&lCOREMC >>> &f"

island:
  only-players: "&cOnly players can use this command."
  unknown-subcommand: "&cThis command does not exist."
  help:
    - "&b&lIsland commands"
    - "&b/is create &8- &fclaim your own island in the void"
    - "&b/is go &8- &fteleport to your island"
    - "&b/is invite <player> &8- &finvite a player to your island"
    - "&b/is join &8- &faccept a pending island invite"
    - "&b/is leave &8- &fleave the island you are a member of"
    - "&b/is delete &8- &fpermanently delete your island"

  created: "&aIsland created — this piece of the void is yours."
  teleported: "&aWelcome home."
  no-island: "&cYou don't have an island. Create one with &b/is create&c."
  already-have: "&cYou already have an island."

  not-owner: "&cOnly the island owner can do that."
  owner-cannot-leave: "&cYou own this island. Use &b/is delete &cif you want to get rid of it."
  left: "&aYou left &f{owner}&a's island."

  delete-confirm: "&cThis will permanently delete your island and evict its members. Run &b/is delete confirm &cwithin &f{seconds}s&c to proceed."
  deleted: "&aIsland deleted. The claim is free — the blocks remain in the void."
  island-deleted-member: "&cThe island you were part of has been deleted by &f{owner}&c."

  invite-usage: "&cUsage: &b/is invite <player>"
  player-not-online: "&cThat player is not online."
  cannot-invite-self: "&cYou cannot invite yourself."
  target-has-island: "&c{player} already has an island."
  invite-sent: "&aInvite sent to &f{player}&a. It expires in &f{seconds}s&a."
  invite-received: "&b{player} &finvited you to their island. Join with &b/is join&f."
  no-invite: "&cYou have no pending island invite."
  invite-expired: "&cThat invite expired or the island no longer exists."
  joined: "&aYou joined &f{owner}&a's island."
  member-joined: "&f{player} &ajoined your island."

  protected-block: "&cYou can't do that here — this island belongs to &f{owner}&c."
  protected-wilderness: "&cYou can only build inside your own island's border."

  schematic-failed: "&cIsland generation failed: &f{error}"

shop:
  only-players: "&cOnly players can use the shop."
  disabled: "&cThe shop is not available right now."
  bought: "&aBought &f{amount} x {item} &afor &e{cost}&a. Balance: &e{balance}."
  sold: "&aSold &f{amount} x {item} &afor &e{credit}&a. Balance: &e{balance}."
  need-coins: "&cThat costs &e{cost} &cbut you only have &e{balance}&c."
  nothing-to-sell: "&cYou have no &f{item} &cto sell."
  not-buyable: "&cThat item cannot be bought."
  not-sellable: "&cThat item cannot be sold."
  dropped: "&e{amount} x {item} &edidn't fit and were dropped at your feet."

spawner:
  only-players: "&cOnly players can use that."
  no-permission: "&cYou do not have permission to use that."
  player-not-found: "&c{player} is not online."
  unknown-mob: "&cUnknown mob or group: &f{id}&c. Try &b/spawner list&c."

  help:
    - "&b&lSpawner commands"
    - "&b/sp list &8- &fevery mob and spawner price"
    - "&b/sp buy <mob> &8- &fbuy a Normal spawner (coins + materials)"
    - "&b/sp info &8- &finspect the spawner you look at"
    - "&b/sp upgrade &8- &fupgrade the spawner you look at"
    - "&b/sp luck &8- &fyour island's unique-drop luck"
    - "&b/sp luck upgrade &8- &fbuy the next luck level"
  help-admin:
    - "&b&lSpawner admin"
    - "&b/sp give <player> <mob> [variant] &8- &fhand out a spawner"
    - "&b/sp giveitem <player> essence|drop|relic <id> [amount] &8- &fhand out materials"
    - "&b/sp setluck <player> <level> &8- &fset island luck"

  list-header: "&b&lSpawner progression &8- mobs and prices"
  usage-buy: "&cUsage: &b/spawner buy <mob>"
  usage-give: "&cUsage: &b/spawner give <player> <mob> [normal|advanced|ancient|mythic]"
  usage-giveitem: "&cUsage: &b/spawner giveitem <player> essence|drop|relic <id> [amount]"
  usage-setluck: "&cUsage: &b/spawner setluck <player> <level>"

  no-island: "&cYou don't have an island. Create one with &b/is create&c."
  cannot-afford: "&cThat costs &e{cost} &cbut you only have &e{balance}&c."
  missing-items: "&cYou still need: &f{missing}&c."

  bought: "&aBought a &f{mob} Spawner &afor &e{cost}&a. Place it on your island!"
  spawner-given: "&aGiven: &f{mob} Spawner &8[&f{variant}&8]&a."
  given: "&aGiven &f{amount} x {item}&a."

  placed: "&a{mob} Spawner &8[&f{variant}&8] &aplaced and active."
  upgrade-look: "&cLook at a spawner (within 6 blocks) to do that."
  not-your-spawner: "&cThat spawner is not on your island."
  already-mythic: "&cThat spawner is already &dMythic&c."
  upgraded: "&aUpgraded to {variant}&a! &7({benefit}&7)"

  luck: "&7Island luck: &f{level}&7/&f{max} &8- &7unique drop chance &f{chance}&7."
  luck-maxed: "&7Your island luck is maxed: &f{chance} &7unique drop chance."
  luck-upgraded: "&aIsland luck upgraded to &f{level}&a! Unique drop chance is now &f{chance}&a."
  set-luck: "&d(admin) &7Island luck set to &f{level} &7(&f{chance} &7unique drop chance)."
  set-luck-admin: "&a{player}'s island luck set to &f{level}&a."

  found-essence: "&b+1 {essence}"
  found-drop: "&eLucky! +1 {drop}"
  found-relic: "&dA rare relic! +1 {relic}"
