  none: "You don't have an island yet. Create one with &f/is create&7."
  deleted: "Your island has been deleted."
  delete-failed: "&cFailed to delete your island. Please contact an administrator."
  delete-confirm: "&cThis permanently deletes your island! Repeat &f/is delete&c within {seconds} seconds to confirm."
  not-owner: "&cOnly the island owner can do that."
  protected: "&cThis island is protected. Only its owner and members may build here."
  team-full: "&cThe island team is full."
  target-offline: "&cPlayer &f{player}&c is not online."
  target-unknown: "&cUnknown player &f{player}&c."
  invite-hint: "Invite a friend with &f/is invite <player>&7."
  invite-usage: "&eUsage: &f/is invite <player>"
  invite-self: "&cYou cannot invite yourself."
  kick-usage: "&eUsage: &f/is kick <member>"
  kick-self: "&cYou cannot kick yourself — delete the island instead."
  kick-not-member: "&cThat player is not a member of your island."
  kicked:
    owner: "Kicked &f{player}&7 from your island."
    you: "&cYou have been kicked from your island."
  left: "You left the island."
  leave-owner: "&cOwners cannot leave — use &f/is delete&c or transfer ownership (coming soon)."
