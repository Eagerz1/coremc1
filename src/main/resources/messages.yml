    none: "&cYou have no pending island invite."
    expired: "&cYour invite expired. Ask for a new one."
    gone: "&cThat island no longer exists."
  info-header: "&b&lISLAND &8— &7your island"
  info-owner: "&7Owner: &f{owner}"
  info-location: "&7Location: &f{x}, {y}, {z} &7in &f{world}"
  info-border: "&7Border: &f{border}"
  info-level: "&7Island level: &b{level}"
  info-members: "&7Members &8({current}/{max})&7: &f{members}"
  info-created: "&7Created: &f{value}"
  help-header: "&b&lISLAND &8— &7commands"
  help-create: "&f/{label} create &8— &7Create your island and teleport there"
  help-home: "&f/{label} home &8— &7Teleport to your island"
  help-invite: "&f/{label} invite <player> &8— &7Invite a player to your island"
  help-team: "&f/{label} accept &8— &7Accept an invite  |  &f/{label} leave &8— &7Leave  |  &f/{label} kick <p>"
  help-info: "&f/{label} info &8— &7Show your island's details"
  help-upgrades: "&f/{label} upgrades &8— &7Open the island upgrades panel"
  help-delete: "&f/{label} delete &8— &7Delete your island (asks for confirmation)"

economy:
  unknown-player: "&cUnknown player &f{player}&c (never played here)."
  error:
    invalid: "&cInvalid amount. Use a positive whole number, e.g. 100."
    negative: "&cAmounts cannot be negative."
    too-large: "&cThat amount is too large. Maximum is 9223372036854775807."

credits:
  usage: "&eUsage: &f/{label} [give|remove|set] <player> <amount>"
  balance: "You have &e{amount} Credits&7."
  given: "Gave &e{amount} Credits&7 to &f{player}&7 (balance: &e{balance}&7)."
  removed: "Removed &e{amount} Credits&7 from &f{player}&7 (balance: &e{balance}&7)."
  set-done: "Set &f{player}&7's Credits to &e{balance}&7."
  insufficient: "&f{player}&c only has &e{balance} Credits&c."

skytokens:
  usage: "&eUsage: &f/{label} [give|remove|set] <player> <amount>"
  balance: "You have &b{amount} Sky Tokens&7."
  given: "Gave &b{amount} Sky Tokens&7 to &f{player}&7 (balance: &b{balance}&7)."
  removed: "Removed &b{amount} Sky Tokens&7 from &f{player}&7 (balance: &b{balance}&7)."
  set-done: "Set &f{player}&7's Sky Tokens to &b{balance}&7."
  insufficient: "&f{player}&c only has &b{balance} Sky Tokens&c."

money:
  usage: "&eUsage: &f/{label} [give|remove|set] <player> <amount>"
  balance: "You have &a${amount}&7."
  given: "Gave &a${amount}&7 to &f{player}&7 (balance: &a${balance}&7)."
  removed: "Removed &a${amount}&7 from &f{player}&7 (balance: &a${balance}&7)."
  set-done: "Set &f{player}&7's Money to &a${balance}&7."
  insufficient: "&f{player}&c only has &a${balance}&c."

profile:
  header: "&b&lPROFILE &8— &f{player}"
  first-join: "&7First join: &f{value}"
  total-logins: "&7Total logins: &f{value}"
  last-seen: "&7Last seen: &f{value}"
  not-found: "&cNo profile data found for '&f{player}&c'."

info:
  lines:
    - "&b&lCOREMC &8— &7version &f{version}"
    - "&7Server: &f{server}"
    - "&7Profiles loaded: &f{profiles}"
    - "&7Tracked tasks: &f{tasks}"
    - "&7Uptime: &f{uptime}"
