# ============================================================
#  CoreMC — progression.yml
#  Island Level, Island Mastery, Island Core slots and active XP.
#
#  Core direction:
#    Island XP comes from ACTIVE gameplay. High-volume sources have
#    rolling caps and diminishing returns so passive/AFK systems cannot
#    dominate a season.
#
#  Mastery Points are limited. Islands must specialise early: Farming,
#  Mining, Fishing, Slayer and Industry branches unlock noticeable
#  mechanics/capacity instead of endless tiny percentages.
#
#  Costs can combine Island Level + Mastery Points + Money + Sky Tokens.
#  Level unlocks permission; currencies pay the sink.
# ============================================================

settings:
  # Island top points granted per island level reached.
  level-up-island-top-points: 5000

industry:
  # Read by the Industry GUI now; future native generators should call the
  # progression service for the effective capacity.
  base-generator-capacity: 1

# Level XP is TOTAL island XP required for that level.
