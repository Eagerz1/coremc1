# ==========================================================================
# CoreMC Shop — every price lives here, never in Java.
#
# /shop <category> opens a category; /tokenshop opens the exchange. Each
# entry:  <id>: { material, display, currency, price, amount, sell-price }
# currency: MONEY | CREDITS | SKY_TOKENS   (amount defaults to 1)
# sell-price: pay PER ITEM when players sell stock back (right-click).
#   Omit or set 0 for unsellable entries (exchange stock, junk blocks).
# ==========================================================================

