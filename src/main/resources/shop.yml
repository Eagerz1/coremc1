# ============================================================
#  CoreMC — shop.yml
#  The skyblock shop: what players can buy and sell. Gear is
#  intentionally NOT sold — on skyblock you craft your own tools
#  and armour from what you trade for here.
#
#  Entries are "MATERIAL:BUY:SELL" (coins per single item).
#  SELL may be omitted: it then defaults to 25% of BUY.
#  A price of 0 disables that direction for the item.
#
#  Every change is validated at startup: unknown materials,
#  sell > buy (infinite money loop) and duplicates in a section
#  refuse to load the shop, with every problem listed in the log.
# ============================================================

