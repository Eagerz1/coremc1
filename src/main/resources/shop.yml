# ============================================================
#  CoreMC — shop.yml
#  The skyblock shop: what players can buy and sell. Gear is
#  intentionally NOT sold — on skyblock you craft your own tools
#  and armour from what you trade for here.
#
#  Entries are "MATERIAL:BUY:SELL" (coins per single item).
#  SELL may be omitted: it then defaults to 25% of BUY.
#  A price of 0 disables that direction for the item.
#
#  A section is either FLAT (a plain "items:" list, browsed as
#  paginated pages) or GROUPED (a "groups:" mapping of
#  subcategories — up to 14, shown two rows of seven in a
#  category picker; each group paginates like a small section).
#  Group icons default to the group's first item.
#
#  default-sell-price is what the /sell window pays for any material
#  that is NOT listed below — so every ordinary block sells for
#  something. (Custom-named progression items are never sold; they are
#  returned when the window closes.)
#
#  Every change is validated at startup: unknown materials,
#  sell > buy (infinite money loop), duplicates anywhere and
#  mixed shapes refuse to load the shop, with every problem
#  listed in the log.
# ============================================================

