# ============================================================
#  CoreMC — crate keys + crates
#
#  CoreMC has exactly five physical crate keys. Keys are real
#  PDC-identified items: renaming or crafting a vanilla item can
#  NEVER create a valid key. Prices are Credits (100 = EUR 1);
#  every key is also earnable in game (voting, ranks, crates,
#  lootboxes, events), paying only accelerates.
#
#  Reward entry shape (under crates.<id>.rewards.<reward-id>):
#    type:     money | tokens | credits | key | lootbox | item | command
#    display:  shown name (& colours, rendered small-caps)
#    rarity:   common | uncommon | rare | epic | legendary
#              (rare+ glows in previews and can broadcast)
#    min/max:  amount range (or amount: for a fixed amount)
#    weight:   share of the pool (chance = weight / pool total)
#    id:       key/lootbox id, or the PDC tag for item rewards
#    material: vanilla material for item rewards
#
#  Every crate has a preview GUI showing amount, rarity, weight
#  and the exact calculated chance — odds are never hidden.
# ============================================================

keys:
  vote:
    name: "&a&lVote Key"
    material: TRIPWIRE_HOOK
    price: 75
    description:
      - "Earned by voting for CoreMC."
      - "Opens the Vote Crate."
  river:
    name: "&b&lRiver Key"
    material: TRIPWIRE_HOOK
    price: 125
    description:
      - "Early farming and fishing loot."
      - "Also granted by rank purchases."
  sky:
    name: "&9&lSky Key"
    material: TRIPWIRE_HOOK
    price: 250
    description:
      - "Midgame progression loot:"
      - "generators, spawners, OmniTool."
