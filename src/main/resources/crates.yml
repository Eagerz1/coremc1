# ======================================================
#  CoreMC — crates & keys
#  `keys:` defines the physical crate-key items (minted by
#  enchant/vote/playtime rewards, consumed by the crate lineup).
#  `crates:` is the gacha lineup: weighted pools opened at /crates.
#
#  Crate fields: display, icon, key/keys (key ids that open it),
#    rewards: (weight = share of the pool, rarity = display colour;
#    a natural legendary resets pity), pity-count + pity-reward
#    SKIN rewards use type: SKIN, ref: <skinId from skins.yml> and grant
#    animated skin ownership (crate-source skins survive season resets)
#    (guaranteed instead of a roll every pity-count opens).
#  Reward types: CURRENCY {currency,min,max} | KEY {key,amount} |
#    SPAWNER {ref: tier id} | GENERATOR {ref: gen id} |
#    ITEM {material,amount}.
# ======================================================

