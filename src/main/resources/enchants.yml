# ======================================================
#  CoreMC — custom enchant catalogue (90 enchants)
#  15 per track: miner / logger / fisher / slayer /
#  farmer / universal. Every entry:
#
#    role:            owner track (universal = every role)
#    display:         GUI/chat name (colour codes)
#    description:     one-line grey lore
#    icon:            GUI material (fallback: ENCHANTED_BOOK)
#    max-level:       highest purchasable level (hard cap 1000)
#    currency:        MONEY | CREDITS | SKY_TOKENS
#    cost-base / cost-growth:
#                     price(level) = base * growth^(level-1), OR an
#                     explicit `costs:` list with exactly max-level
#                     entries (list wins when present)
#    effect:          behaviour kind (see EnchantEffect javadoc)
#    trigger:         MINE | LOG | FISH | KILL | FARM | ANY | PASSIVE
#    chance-base / chance-scale / chance-cap:
#                     activation chance = min(cap, base+scale*(lvl-1))
#    value-base / value-scale:
#                     magnitude = base+scale*(lvl-1) (meaning depends
#                     on the effect — see EnchantEffect javadoc)
#    cooldown-seconds: per-player trigger cooldown (0 = none)
#    min-role-level:  role level required before buying (default 1)
#    values:          behaviour-specific tuning (rewards tables,
#                     targets, modes — all documented in EnchantEffect)
#
#  Malformed entries are skipped with a console warning — a typo
#  never bricks the catalogue. Reload with /coremc reload.
# ======================================================

