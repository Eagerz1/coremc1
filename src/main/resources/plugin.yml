name: CoreMC
version: '@project.version@'
main: com.coremc.core.CoreMCPlugin
api-version: '1.21'
description: CoreMC Skyblock core plugin.
author: CoreMC Team
website: https://github.com/Eagerz1/coremc1

commands:
  island:
    description: CoreMC Skyblock island commands.
    usage: /is [create|go|leave|delete|invite|join|help]
    permission: coremc.command.island
    permission-message: You do not have permission to use this command.
    aliases: [is, isle, block]
  shop:
    description: CoreMC Skyblock shop.
    usage: /shop
    permission: coremc.command.shop
    permission-message: You do not have permission to use this command.
    aliases: [store]

permissions:
  coremc.*:
    description: Grants all CoreMC permissions.
    default: op
    children:
      coremc.command.island: true
      coremc.command.shop: true
      coremc.island.bypass: true
  coremc.command.island:
    description: Allows using /is.
    default: true
  coremc.command.shop:
    description: Allows using /shop.
    default: true
  coremc.island.bypass:
    description: Allows building anywhere in the island world, bypassing island protection.
    default: op
