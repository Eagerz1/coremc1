name: CoreMC
version: '@project.version@'
main: com.coremc.core.CoreMCPlugin
api-version: '1.21'
description: CoreMC Skyblock core plugin.
author: CoreMC Team
website: https://github.com/Eagerz1/coremc1

commands:
  coremc:
    description: CoreMC administration and information command.
    usage: /coremc [info|reload|help]
    permission: coremc.command.coremc
    permission-message: "&cYou do not have permission to use this command."
  profile:
    description: View your CoreMC player profile.
    usage: /profile [player]
    permission: coremc.command.profile
    permission-message: "&cYou do not have permission to use this command."
  heal:
    description: Restore a player's health, hunger and extinguish fire.
    usage: /heal [player]
    permission: coremc.command.heal
    permission-message: "&cYou do not have permission to use this command."
  island:
    description: CoreMC Skyblock island commands.
    usage: /island <create|teleport|info|delete|help>
    permission: coremc.command.island
    permission-message: "&cYou do not have permission to use this command."
    aliases: [is, isle, block]

permissions:
  coremc.*:
    description: Grants all CoreMC permissions.
    default: op
    children:
      coremc.command.*: true
  coremc.command.*:
    description: Grants all CoreMC command permissions.
    children:
      coremc.command.coremc: true
      coremc.command.coremc.reload: true
      coremc.command.profile: true
      coremc.command.profile.others: true
      coremc.command.heal: true
      coremc.command.heal.others: true
      coremc.command.island: true
  coremc.command.coremc:
    description: Allows using /coremc.
    default: true
  coremc.command.coremc.reload:
    description: Allows reloading CoreMC configuration.
    default: op
  coremc.command.profile:
    description: Allows viewing your own profile.
    default: true
  coremc.command.profile.others:
    description: Allows viewing other players' profiles.
    default: op
  coremc.command.heal:
    description: Allows healing yourself.
    default: op
  coremc.command.heal.others:
    description: Allows healing other players.
    default: op
  coremc.command.island:
    description: Allows using Skyblock island commands.
    default: true
