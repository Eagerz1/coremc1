name: CoreMC
version: '@project.version@'
main: com.coremc.core.CoreMCPlugin
api-version: '1.21'
description: CoreMC Skyblock core plugin.
author: CoreMC Team
softdepend: [Vault, PlaceholderAPI]
website: https://github.com/Eagerz1/coremc1

commands:
  island:
    description: CoreMC Skyblock island commands.
    usage: /is [menu|create|go|leave|delete|invite|join|kick|help]
    permission: coremc.command.island
    permission-message: You do not have permission to use this command.
    aliases: [is, isle, block]
  shop:
    description: CoreMC Skyblock shop.
    usage: /shop
    permission: coremc.command.shop
    permission-message: You do not have permission to use this command.
  sell:
    description: "Open the sell window - drop items in, close to get paid."
    usage: /sell
    permission: coremc.command.sell
    permission-message: You do not have permission to use this command.
  giftcard:
    description: "Your Tebex webstore giftcard - number (click to copy) and balance."
    usage: /giftcard [link <code>]
    permission: coremc.command.giftcard
    permission-message: You do not have permission to use this command.
    aliases: [gc]
  spawner:
    description: "CoreMC spawner progression - list, buy, upgrade, luck."
    usage: /spawner [menu|list|buy <mob>|info|upgrade|luck [upgrade]]
    permission: coremc.command.spawner
    permission-message: You do not have permission to use this command.
    aliases: [sp]
  gens:
    description: "CoreMC generator progression - menu, list, buy, info."
    usage: /gens [menu|list|buy <generator> [amount]|info]
    permission: coremc.command.gens
    permission-message: You do not have permission to use this command.
    aliases: [gen, generator, generators]
  rank:
    description: "CoreMC rank ladder - view, list, buy, admin set."
    usage: /rank [view|list|buy|set <player> <rank>]
    permission: coremc.command.rank
    permission-message: You do not have permission to use this command.
    aliases: [ranks, tier]
  fly:
    description: "Toggle flight (any rank)."
    usage: /fly
    permission: coremc.command.fly
    permission-message: You do not have permission to use this command.
    aliases: [flight]
  echest:
    description: "Open your ender chest anywhere (any rank)."
    usage: /echest
    permission: coremc.command.echest
    permission-message: You do not have permission to use this command.
    aliases: [ec, enderchest]
  season:
    description: "Show the current season; admins can start a new one."
    usage: /season [set <number>]
    permission: coremc.command.season
    permission-message: You do not have permission to use this command.
  essence:
    description: "Essence balances - view yours (or a player's); admins give/take/set."
    usage: /essence [balance [player]|give|take|set <player> <type> <amount>]
    permission: coremc.command.essence
    permission-message: You do not have permission to use this command.
    aliases: [essences, ess]
  store:
    description: "The CoreMC store - crate keys, lootboxes and bundles, paid with Credits."
    usage: /store
    permission: coremc.command.store
    permission-message: You do not have permission to use this command.
  rewards:
    description: "Claim pending store/crate/lootbox rewards that did not fit your inventory."
    usage: /rewards
    permission: coremc.command.rewards
    permission-message: You do not have permission to use this command.
  corecredits:
    description: "Credits - view balances; admins give/take/set with an audit reason."
    usage: /corecredits [balance [player]|give|take|set <player> <amount> [reason]]
    permission: coremc.command.corecredits
    permission-message: You do not have permission to use this command.
    aliases: [credits]
  corecrate:
    description: "Crate admin - give keys, bind/unbind crate blocks, list bindings."
    usage: /corecrate givekey <player> <type> <amount> | set <crate> [world x y z] | remove | list
    permission: coremc.command.corecrate
    permission-message: You do not have permission to use this command.
  corelootbox:
    description: "Lootbox admin - give physical lootboxes."
    usage: /corelootbox give <player> <type> <amount>
    permission: coremc.command.corelootbox
    permission-message: You do not have permission to use this command.
  blackmarket:
    description: The Black Market — rotating limited-stock offers and the Dark Auction.
    aliases: [bm, darkauction]
    permission: coremc.command.blackmarket
  coremarket:
    description: Staff controls for the Black Market and Dark Auction.
    permission: coremc.admin.market
  corebundle:
    description: "Bundle admin - give a bundle's exact contents."
    usage: /corebundle give <player> <type> <amount>
    permission: coremc.command.corebundle
    permission-message: You do not have permission to use this command.

permissions:
  coremc.*:
    description: Grants all CoreMC permissions.
    default: op
    children:
      coremc.command.island: true
      coremc.command.shop: true
      coremc.command.sell: true
      coremc.command.giftcard: true
      coremc.command.spawner: true
      coremc.command.gens: true
      coremc.command.rank: true
      coremc.command.fly: true
      coremc.command.echest: true
      coremc.command.season: true
      coremc.command.essence: true
      coremc.command.store: true
      coremc.command.rewards: true
      coremc.command.corecredits: true
      coremc.command.corecrate: true
      coremc.command.corelootbox: true
      coremc.command.corebundle: true
      coremc.command.blackmarket: true
      coremc.admin.market: true
      coremc.admin.credits: true
      coremc.admin.crates: true
      coremc.admin.lootboxes: true
      coremc.admin.bundles: true
      coremc.rank.admin: true
      coremc.season.admin: true
      coremc.island.bypass: true
      coremc.spawner.admin: true
      coremc.gens.admin: true
  coremc.command.island:
    description: Allows using /is.
    default: true
  coremc.command.shop:
    description: Allows using /shop.
    default: true
  coremc.command.sell:
    description: Allows using /sell.
    default: true
  coremc.command.giftcard:
    description: Allows using /giftcard.
    default: true
  coremc.command.spawner:
    description: Allows using /spawner.
    default: true
  coremc.spawner.admin:
    description: Allows the admin tools /spawner give, giveitem and setluck.
    default: op
  coremc.command.gens:
    description: Allows using /gens.
    default: true
  coremc.gens.admin:
    description: Allows the admin tool /gens give.
    default: op
  coremc.command.rank:
    description: Allows using /rank.
    default: true
  coremc.command.fly:
    description: Allows using /fly (a rank is still required).
    default: true
  coremc.command.echest:
    description: Allows using /echest (a rank is still required).
    default: true
  coremc.command.season:
    description: Allows using /season.
    default: true
  coremc.command.essence:
    description: Allows using /essence to view balances.
    default: true
  coremc.admin.essence:
    description: Allows /essence give|take|set <player> <type> <amount>.
    default: op
  coremc.command.store:
    description: Allows using /store.
    default: true
  coremc.command.rewards:
    description: Allows using /rewards.
    default: true
  coremc.command.corecredits:
    description: Allows using /corecredits (viewing needs no admin permission).
    default: true
  coremc.command.corecrate:
    description: Allows using /corecrate (all subcommands are admin-gated).
    default: true
  coremc.command.corelootbox:
    description: Allows using /corelootbox (all subcommands are admin-gated).
    default: true
  coremc.command.corebundle:
    description: Allows using /corebundle (all subcommands are admin-gated).
    default: true
  coremc.command.blackmarket:
    description: Use /blackmarket.
    default: true
  coremc.admin.market:
    description: Staff Black Market/Dark Auction controls.
    default: op
  coremc.admin.credits:
    description: Allows /corecredits give|take|set (logged with reasons).
    default: op
  coremc.admin.crates:
    description: Allows /corecrate admin tools and unbinding crate blocks.
    default: op
  coremc.admin.lootboxes:
    description: Allows /corelootbox give.
    default: op
  coremc.admin.bundles:
    description: Allows /corebundle give.
    default: op
  coremc.rank.admin:
    description: Allows /rank set <player> <rank|none>.
    default: op
  coremc.season.admin:
    description: Allows /season set <number> to start a new season.
    default: op
  coremc.island.bypass:
    description: Allows building anywhere in the island world, bypassing island protection.
    default: op
