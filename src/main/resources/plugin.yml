name: CoreMC
version: '@project.version@'
main: com.coremc.core.CoreMCPlugin
api-version: '1.21'
description: CoreMC Skyblock core plugin.
author: CoreMC Team
website: https://github.com/Eagerz1/coremc1

commands:
  coremc:
    description: CoreMC administration and information command.
    usage: /coremc [info|reload|help]
    permission: coremc.command.coremc
    permission-message: "&cYou do not have permission to use this command."
  profile:
    description: View your CoreMC player profile.
    usage: /profile [player]
    permission: coremc.command.profile
    permission-message: "&cYou do not have permission to use this command."
  heal:
    description: Restore a player's health, hunger and extinguish fire.
    usage: /heal [player]
    permission: coremc.command.heal
    permission-message: "&cYou do not have permission to use this command."
  island:
    description: CoreMC Skyblock island commands.
    usage: /island [create|home|invite|accept|leave|kick|delete|info|upgrades|progression|mastery|help]
    permission: coremc.command.island
    permission-message: "&cYou do not have permission to use this command."
    aliases: [is, isle, block]
  credits:
    description: View your Credits or manage them as an admin.
    usage: /credits [give|remove|set] <player> <amount>
    permission: coremc.command.credits
    permission-message: "&cYou do not have permission to use this command."
  skytokens:
    description: View your Sky Tokens or manage them as an admin.
    usage: /skytokens [give|remove|set] <player> <amount>
    permission: coremc.command.skytokens
    permission-message: "&cYou do not have permission to use this command."
  money:
    description: View your Money or manage it as an admin.
    usage: /money [give|remove|set] <player> <amount>
    permission: coremc.command.money
    permission-message: "&cYou do not have permission to use this command."
  event:
    description: Check the current Core Hour and the next event countdown.
    usage: /event
    permission: coremc.command.event
    permission-message: "&cYou do not have permission to use this command."
  hud:
    description: Toggle the CoreMC player sidebar.
    usage: /hud
    permission: coremc.command.hud
    permission-message: "&cYou do not have permission to use this command."
  role:
    description: Choose your CoreMC role and view progression.
    usage: /role [miner|logger|fisher|slayer|farmer|universal|info]
    permission: coremc.command.role
    permission-message: "&cYou do not have permission to use this command."
  skins:
    description: Browse, preview and apply animated tool skins and hats.
    usage: /skins [help|list|grant|revoke|set|clear|resetseason|reload]
    permission: coremc.command.skins
    permission-message: "&cYou do not have permission to use this command."
  gens:
    description: Open the generator market.
    usage: /gens
    permission: coremc.command.gens
    permission-message: "&cYou do not have permission to use this command."
  companions:
    description: Unlock, summon and level gameplay companions.
    usage: /companions
    aliases: [pets]
    permission: coremc.command.companions
    permission-message: "&cYou do not have permission to use this command."
  quests:
    description: View and claim daily gameplay missions.
    usage: /quests
    aliases: [missions, daily]
    permission: coremc.command.quests
    permission-message: "&cYou do not have permission to use this command."
  spawners:
    description: View spawner unlock progress and buy spawners.
    usage: /spawners
    permission: coremc.command.spawners
  crates:
    description: Open the crate lineup.
    usage: /crates
    permission: coremc.command.crates
    permission-message: "&cYou do not have permission to use this command."
  shop:
    description: Open the CoreMC shop (optionally straight into a category).
    usage: /shop [blocks|food|redstone|misc|ores]
    permission: coremc.command.shop
    permission-message: "&cYou do not have permission to use this command."
  tokenshop:
    description: Open the Sky Token exchange.
    usage: /tokenshop
    permission: coremc.command.tokenshop
    permission-message: "&cYou do not have permission to use this command."
  tags:
    description: Choose your cosmetic chat tag (staff can grant/revoke).
    usage: /tags [select <id>|clear|list|grant <player> <id>|revoke <player> <id>|check <player>|reload]
    permission: coremc.command.tags
    permission-message: "&cYou do not have permission to use this command."
  chatcolour:
    description: Choose your chat message colour or gradient.
    usage: /chatcolour [set <id>|bold|reset|list|grant <player> <id>|revoke <player> <id>|check <player>]
    permission: coremc.command.chatcolour
    permission-message: "&cYou do not have permission to use this command."
    aliases: [chatcolor, cc]

  vanish:
    description: Toggle staff vanish.
    usage: /vanish
    aliases: [v]
  spectate:
    description: Spectate a player and restore your previous state when finished.
    usage: /spectate <player>
    aliases: [spec]
  cps:
    description: Measure arm-swing CPS for a short window.
    usage: /cps <player>
  rotate:
    description: Rotate a player's point of view.
    usage: /rotate <player> [degrees]
  freeze:
    description: Toggle movement freeze for a player.
    usage: /freeze <player> [reason]
  kick:
    description: Kick an online player with an audit record.
    usage: /kick <player> [reason]
  mute:
    description: Mute an online or offline player.
    usage: /mute <player> <duration|permanent> [reason]
  ban:
    description: Ban an online or offline player.
    usage: /ban <player> <duration|permanent> [reason]
  unmute:
    description: Revoke an active CoreMC mute.
    usage: /unmute <player> [reason]
  unban:
    description: Revoke an active CoreMC ban.
    usage: /unban <player> [reason]
  t1:
    description: Apply a configured Tier 1 moderation action.
    usage: /t1 <rule> <player> [custom reason]
  t2:
    description: Apply a configured Tier 2 moderation action.
    usage: /t2 <rule> <player> [custom reason]
  t3:
    description: Apply a configured Tier 3 moderation action.
    usage: /t3 <rule> <player> [custom reason]
  t4:
    description: Apply a configured Tier 4 moderation action.
    usage: /t4 <rule> <player> [custom reason]
  t5:
    description: Apply a configured Tier 5 moderation action.
    usage: /t5 <rule> <player> [custom reason]
  history:
    description: View a player's CoreMC moderation history.
    usage: /history <player> [page]
    aliases: [modhistory]
  tiercorrect:
    description: Correct a player's tier offence counters with an audit record.
    usage: /tiercorrect <player> <tier> <set|add> <amount> [reason]

permissions:
  coremc.*:
    description: Grants all CoreMC permissions.
    default: op
    children:
      coremc.command.*: true
      coremc.moderation.*: true
  coremc.command.*:
    description: Grants all CoreMC command permissions.
    children:
      coremc.command.coremc: true
      coremc.command.coremc.reload: true
      coremc.command.profile: true
      coremc.command.profile.others: true
      coremc.command.heal: true
      coremc.command.heal.others: true
      coremc.command.island: true
      coremc.command.credits: true
      coremc.command.skytokens: true
      coremc.command.money: true
      coremc.command.event: true
      coremc.command.role: true
      coremc.command.gens: true
      coremc.command.companions: true
      coremc.command.quests: true
      coremc.command.spawners: true
      coremc.command.crates: true
      coremc.command.skins: true
      coremc.command.shop: true
      coremc.command.tokenshop: true
      coremc.command.tags: true
      coremc.command.chatcolour: true
      coremc.admin.tags: true
      coremc.admin.chatcolour: true
      coremc.tag.*: true
      coremc.chatcolour.*: true
      coremc.chatcolour.bold: true
      coremc.chat.format: true
      coremc.admin.credits: true
      coremc.admin.skytokens: true
      coremc.admin.money: true
      coremc.skins.admin: true
      coremc.island.bypass: true
  coremc.moderation.*:
    description: Grants all CoreMC moderation permissions.
    default: op
    children:
      coremc.moderation.vanish: true
      coremc.moderation.vanish.see: true
      coremc.moderation.spectate: true
      coremc.moderation.cps: true
      coremc.moderation.rotate: true
      coremc.moderation.freeze: true
      coremc.moderation.freeze.bypass: true
      coremc.moderation.kick: true
      coremc.moderation.mute: true
      coremc.moderation.ban: true
      coremc.moderation.unmute: true
      coremc.moderation.unban: true
      coremc.moderation.tier.1: true
      coremc.moderation.tier.2: true
      coremc.moderation.tier.3: true
      coremc.moderation.tier.4: true
      coremc.moderation.tier.5: true
      coremc.moderation.history: true
      coremc.moderation.correction: true
      coremc.moderation.override: true
      coremc.staff.rank.manager: true
  coremc.moderation.vanish:
    description: Allows toggling staff vanish.
    default: op
  coremc.moderation.vanish.see:
    description: Allows seeing vanished staff.
    default: op
  coremc.moderation.spectate:
    description: Allows spectating players.
    default: op
  coremc.moderation.cps:
    description: Allows CPS checks.
    default: op
  coremc.moderation.rotate:
    description: Allows rotating player POV.
    default: op
  coremc.moderation.freeze:
    description: Allows freezing and unfreezing players.
    default: op
  coremc.moderation.freeze.bypass:
    description: Allows bypassing freeze restrictions.
    default: op
  coremc.moderation.kick:
    description: Allows kicking players.
    default: op
  coremc.moderation.mute:
    description: Allows muting players.
    default: op
  coremc.moderation.ban:
    description: Allows banning players.
    default: op
  coremc.moderation.unmute:
    description: Allows revoking CoreMC mutes.
    default: op
  coremc.moderation.unban:
    description: Allows revoking CoreMC bans.
    default: op
  coremc.moderation.tier.1:
    description: Allows Tier 1 rule actions.
    default: op
  coremc.moderation.tier.2:
    description: Allows Tier 2 rule actions.
    default: op
  coremc.moderation.tier.3:
    description: Allows Tier 3 rule actions.
    default: op
  coremc.moderation.tier.4:
    description: Allows Tier 4 rule actions.
    default: op
  coremc.moderation.tier.5:
    description: Allows Tier 5 rule actions.
    default: op
  coremc.moderation.history:
    description: Allows viewing moderation history.
    default: op
  coremc.moderation.correction:
    description: Allows correcting tier counters.
    default: op
  coremc.moderation.override:
    description: Allows acting on equal/higher rank staff.
    default: op
  coremc.staff.rank.helper:
    description: Marks a player as Helper for CoreMC moderation.
    default: false
  coremc.staff.rank.mod:
    description: Marks a player as Mod for CoreMC moderation.
    default: false
  coremc.staff.rank.srmod:
    description: Marks a player as SrMod for CoreMC moderation.
    default: false
  coremc.staff.rank.jr_admin:
    description: Marks a player as Jr Admin for CoreMC moderation.
    default: false
  coremc.staff.rank.admin:
    description: Marks a player as Admin for CoreMC moderation.
    default: false
  coremc.staff.rank.manager:
    description: Marks a player as Manager for CoreMC moderation.
    default: op
  coremc.command.coremc:
    description: Allows using /coremc.
    default: true
  coremc.command.coremc.reload:
    description: Allows reloading CoreMC configuration.
    default: op
  coremc.command.profile:
    description: Allows viewing your own profile.
    default: true
  coremc.command.profile.others:
    description: Allows viewing other players' profiles.
    default: op
  coremc.command.heal:
    description: Allows healing yourself.
    default: op
  coremc.command.heal.others:
    description: Allows healing other players.
    default: op
  coremc.command.island:
    description: Allows using Skyblock island commands.
    default: true
  coremc.command.credits:
    description: Allows viewing your Credits balance.
    default: true
  coremc.command.skytokens:
    description: Allows viewing your Sky Tokens balance.
    default: true
  coremc.command.money:
    description: Allows viewing your Money balance.
    default: true
  coremc.command.event:
    description: Allows checking the Core Hour event schedule.
    default: true
  coremc.command.hud:
    description: Allows toggling the CoreMC sidebar.
    default: true
  coremc.command.role:
    description: Allows choosing a role and viewing progression.
    default: true
  coremc.command.gens:
    description: Allows opening the generator market.
    default: true
  coremc.command.companions:
    description: Allows opening the companion collection.
    default: true
  coremc.command.quests:
    description: Allows opening the daily mission board.
    default: true
  coremc.command.spawners:
    description: Allows viewing spawner progression and purchasing spawners.
    default: true
  coremc.command.skins:
    description: Allows opening the /skins menu.
    default: true
  coremc.skins.admin:
    description: Allows managing animated skins (grant/revoke/set/clear/resetseason/reload).
    default: op
  coremc.command.crates:
    description: Allows opening the crate lineup.
    default: true
  coremc.command.shop:
    description: Allows opening the shop.
    default: true
  coremc.command.tokenshop:
    description: Allows opening the Sky Token exchange.
    default: true
  coremc.admin.credits:
    description: Allows giving/removing/setting Credits.
    default: op
  coremc.admin.skytokens:
    description: Allows giving/removing/setting Sky Tokens.
    default: op
  coremc.admin.money:
    description: Allows giving/removing/setting Money.
    default: op
  coremc.island.bypass:
    description: Allows bypassing island border protection.
    default: op
  coremc.command.tags:
    description: Allows opening the tag menu and equipping owned tags.
    default: true
  coremc.command.chatcolour:
    description: Allows opening the chat colour menu.
    default: true
  coremc.admin.tags:
    description: Allows granting, revoking, checking and clearing tags.
    default: op
  coremc.admin.chatcolour:
    description: Allows granting, revoking, checking and resetting chat styles.
    default: op
  coremc.tag.*:
    description: Grants every cosmetic tag.
    default: false
  coremc.chatcolour.*:
    description: Grants every chat colour and gradient.
    default: false
  coremc.chatcolour.bold:
    description: Allows toggling bold chat.
    default: false
  coremc.chat.format:
    description: Allows typing '&' colour codes directly in chat.
    default: op
