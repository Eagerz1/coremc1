# ============================================================
#  CoreMC — lootboxes
#
#  Three physical ENDER_CHEST lootboxes (PDC-identified, can NEVER
#  be placed). Right-clicking a block starts the premium opening:
#  the chest rises and spins, 8 normal rewards reveal one by one,
#  then 1 guaranteed Rare reveals dramatically. All 9 rewards are
#  rolled and persisted BEFORE the animation, so disconnects and
#  crashes can never lose them (/rewards + auto-delivery on join).
#
#  Prices are Credits. categories: lines appear in the item lore.
#  normal-rewards is rolled 8 times, rare-rewards exactly once.
#  Reward entry shape: see crates.yml. Odds are never hidden —
#  the preview GUI shows weight and exact chance for every entry.
# ============================================================

