    product: OBSIDIAN
    price: 15000
    cooldown-seconds: 15
  ice:
    display: "&bIce Generator"
    block: BLUE_ICE
    product: PACKED_ICE
    price: 25000
    cooldown-seconds: 20
  quartz:
    display: "&eQuartz Generator"
    block: QUARTZ_BRICKS
    product: QUARTZ
    price: 40000
    cooldown-seconds: 25
  stone:
    display: "&7Stone Generator"
    block: STONE_BRICKS
    product: STONE
    price: 7500
    cooldown-seconds: 6
  coal:
    display: "&8Coal Generator"
