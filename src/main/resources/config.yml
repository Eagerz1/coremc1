# ======================================================
#  CoreMC — main configuration
#  Messages and branding live in messages.yml
# ======================================================

player-data:
  # How often dirty player profiles are flushed to disk (seconds).
  # Data is also saved on quit and on server shutdown, so this is
  # only a safety net against crashes.
  autosave-seconds: 300

welcome:
  # Send the branded first-join welcome message (messages.yml -> welcome-first-join)
  first-join-message: true

island:
  # World islands live in. CoreMC creates this world automatically when it
  # does not exist (as empty void terrain — the dedicated island world).
  # Islands created before the dedicated world existed keep working in
  # whatever world they were created in (stored per island).
  world: islands
  # Distance (blocks) between island centres on the grid. Minimum 64.
  # Changing this only affects NEW islands; existing islands keep their
  # absolute centre coordinates.
  spacing: 256
  # Y level of the island platform surface (grass layer).
  # Players spawn one block above this.
  start-height: 64
  # Seconds the player has to repeat /island delete to confirm deletion.
  delete-confirm-seconds: 15
  # Protected border of a new island (full width). 50 = 50x50 square.
  # Must stay below spacing/2 so borders can never overlap (enforced).
  border-size: 50
  # Base number of members (non-owner) an island can hold.
  member-slots: 3
  # Seconds an /is invite stays valid.
  invite-expiry-seconds: 60
  # Island upgrades — purchasable with Sky Tokens via /is upgrades.
  # costs[n] = price of buying tier (n+1). Effects apply immediately.
  # Every subsection here is a track; the GUI groups them by category
  # (Mining, Fishing, Farming, Slaying, Logging, Island).
  upgrades:
    # NOTE: there is deliberately no storage track — CoreMC has no
    # island storage system, so storage upgrades would scale nothing.
    # ---- ISLAND category ----
    border:
      # Absolute border width per tier (index = tier): 50 -> 200.
      # When present this list wins; step-blocks below is the legacy
      # fallback for configs without sizes.
      sizes: [50, 75, 100, 125, 150, 175, 200]
      # Each tier widens the protected square by this many blocks
      # (legacy fallback when sizes: is absent).
      step-blocks: 25
      max-tier: 6
      costs: [10, 20, 30, 40, 50, 75]
    member-slots:
      # Each tier adds one member slot (on top of member-slots above).
      max-tier: 5
      costs: [5, 10, 15, 20, 25]
    generator-boost:
      # Each tier cuts generator harvest cooldowns on the island by
      # cooldown-reduction-percent-per-level (floored at 1s).
      max-tier: 5
      costs: [100, 200, 350, 550, 800]
      cooldown-reduction-percent-per-level: 8
      requires:
        mining-cube: 3
    spawner-boost:
      # Each tier speeds spawner cycles up by
      # delay-reduction-percent-per-level and adds
      # extra-spawn-percent-per-level for one extra mob.
      max-tier: 5
      costs: [150, 300, 500, 800, 1200]
      delay-reduction-percent-per-level: 10
      extra-spawn-percent-per-level: 5
      requires:
        border: 2
    # ---- MINING category ----
    mining-cube:
      # Tier 0 = no cube; tier T = a min(T+1,5)-edge cube beside the
      # island (5x5 cap from tier 4). Tiers 5-10 regenerate faster and
      # restore more per cycle; tiers 11-15 also unlock rich contents.
      max-tier: 15
      costs: [15, 25, 40, 60, 90, 130, 180, 250, 330, 430, 550, 700, 900, 1200, 1600]
      # Weighted contents of regenerated cube blocks (material: weight).
      contents:
        STONE: 60
        COBBLESTONE: 15
        COAL_ORE: 10
        IRON_ORE: 7
        GOLD_ORE: 4
        LAPIS_ORE: 3
        DIAMOND_ORE: 1
      # Rich contents merged in once the tier is reached.
      contents-tier-8:
        EMERALD_ORE: 2
        DIAMOND_ORE: 2
        GOLD_ORE: 3
      contents-tier-12:
        ANCIENT_DEBRIS: 1
        EMERALD_ORE: 3
        DIAMOND_ORE: 3
      # Regen cadence: seconds(tier) = max(min, base - (tier-1) * step).
      regen-base-seconds: 30
      regen-step-seconds: 2
      regen-min-seconds: 5
    # ---- FARMING category ----
    crop-regrowth:
      # Spec track: level 0-20. Level L = L*5% chance that a harvested
      # mature crop replants itself (consuming one seed from the drops).
      max-tier: 20
      costs: [5, 5, 8, 8, 10, 10, 12, 12, 14, 14, 16, 16, 18, 18, 20, 20, 22, 22, 24, 25]
      chance-percent-per-level: 5
    # ---- FISHING category ----
    fisher-blessing:
      # Tier L = L*10% chance of a second catch while fishing on the island.
      max-tier: 5
      costs: [10, 20, 30, 40, 50]
      chance-percent-per-level: 10
    # ---- SLAYING category ----
    slayer-force:
      # Tier L = +L*5% melee damage while on your own island.
      max-tier: 5
      costs: [10, 20, 30, 40, 50]
      damage-percent-per-level: 5
    # ---- LOGGING category ----
    woodcutter:
      # Tier L = L*10% chance of double log drops on the island.
      max-tier: 5
      costs: [8, 16, 24, 32, 40]
      chance-percent-per-level: 10

roles:
  # Global multiplier applied to all role XP gains (1.0 = default).
  xp-multiplier: 1.0
  # Fraction of full XP the Universal role earns from ANY category action.
  universal-share: 0.25

# --------------------------------------------------------------------------
# OMNITOOL UPGRADES (Omni-Tool panel, shift right-click with the tool)
# Permanent per-player upgrades bought with Credits. `costs` has one entry
# per level (index 0 = price of level 1). The Efficiency level is stamped
# onto the soulbound tool; Fortune multiplies Auto-Smelter ingots.
# --------------------------------------------------------------------------
omnitool:
  upgrades:
    efficiency:
      display: "&eOmni Efficient Material"
      max-level: 5
      costs: [2500, 7500, 25000, 75000, 200000]
    fortune:
      display: "&6Omni Fortune Coating"
      max-level: 3
      costs: [10000, 40000, 120000]
    smelter:
      display: "&cOmni Auto-Smelter"
      max-level: 1
      costs: [50000]

# --------------------------------------------------------------------------
# GENERATOR MARKET (/gens)
# Generators are bought with Credits, placed in the world, and right-clicked
# to harvest their product after a cooldown. All balance lives here.
# --------------------------------------------------------------------------
generators:
  cobble:
    display: "&fCobblestone Generator"
    block: OBSERVER
    product: COBBLESTONE
    price: 5000
    cooldown-seconds: 5
  obsidian:
    display: "&5Obsidian Generator"
    block: CRYING_OBSIDIAN
    product: OBSIDIAN
    price: 15000
    cooldown-seconds: 15
  ice:
    display: "&bIce Generator"
    block: BLUE_ICE
    product: PACKED_ICE
    price: 25000
    cooldown-seconds: 20
  quartz:
    display: "&eQuartz Generator"
    block: QUARTZ_BRICKS
    product: QUARTZ
    price: 40000
    cooldown-seconds: 25

# --------------------------------------------------------------------------
# SPAWNERS (/spawners)
# Per-mob kill progression unlocks progressively BETTER spawner tiers.
# Each mob lane has up to 4 tiers; a tier is unlocked once the player has
# killed <required-kills> of that entity, then bought with Sky Tokens.
# spawn-count / spawn-delay-ticks are applied to the placed spawner block
# (fewer ticks = faster cycle, more spawns per cycle = better tier).
# --------------------------------------------------------------------------
spawners:
  # Anti-farming: kills above this per rolling minute do not count.
  kill-cap-per-minute: 120
  zombie:
    display: "&2Zombie"
    entity: ZOMBIE
    icon: ZOMBIE_SPAWN_EGG
    tiers:
      - { display: "&2Zombie Spawner I",    required-kills: 25,  price: 5,  spawn-count: 1, spawn-delay-ticks: 400 }
      - { display: "&2Zombie Spawner II",   required-kills: 60,  price: 15, spawn-count: 2, spawn-delay-ticks: 320 }
      - { display: "&2Zombie Spawner III",  required-kills: 120, price: 30, spawn-count: 3, spawn-delay-ticks: 240 }
      - { display: "&2Zombie Spawner IV",   required-kills: 200, price: 50, spawn-count: 4, spawn-delay-ticks: 160 }
  skeleton:
    display: "&7Skeleton"
    entity: SKELETON
    icon: SKELETON_SPAWN_EGG
    tiers:
      - { display: "&7Skeleton Spawner I",   required-kills: 35,  price: 8,  spawn-count: 1, spawn-delay-ticks: 400 }
      - { display: "&7Skeleton Spawner II",  required-kills: 75,  price: 22, spawn-count: 2, spawn-delay-ticks: 320 }
      - { display: "&7Skeleton Spawner III", required-kills: 140, price: 40, spawn-count: 3, spawn-delay-ticks: 240 }
      - { display: "&7Skeleton Spawner IV",  required-kills: 240, price: 65, spawn-count: 4, spawn-delay-ticks: 160 }
  spider:
    display: "&cSpider"
    entity: SPIDER
    icon: SPIDER_SPAWN_EGG
    tiers:
      - { display: "&cSpider Spawner I",   required-kills: 50,  price: 12, spawn-count: 1, spawn-delay-ticks: 400 }
      - { display: "&cSpider Spawner II",  required-kills: 100, price: 30, spawn-count: 2, spawn-delay-ticks: 320 }
      - { display: "&cSpider Spawner III", required-kills: 180, price: 55, spawn-count: 3, spawn-delay-ticks: 240 }
      - { display: "&cSpider Spawner IV",  required-kills: 300, price: 90, spawn-count: 4, spawn-delay-ticks: 160 }
  creeper:
    display: "&aCreeper"
    entity: CREEPER
    icon: CREEPER_SPAWN_EGG
    tiers:
      - { display: "&aCreeper Spawner I",   required-kills: 75,  price: 20,  spawn-count: 1, spawn-delay-ticks: 400 }
      - { display: "&aCreeper Spawner II",  required-kills: 150, price: 50,  spawn-count: 2, spawn-delay-ticks: 320 }
      - { display: "&aCreeper Spawner III", required-kills: 260, price: 90,  spawn-count: 3, spawn-delay-ticks: 240 }
      - { display: "&aCreeper Spawner IV",  required-kills: 400, price: 150, spawn-count: 4, spawn-delay-ticks: 160 }
