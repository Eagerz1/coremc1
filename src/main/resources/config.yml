# --------------------------------------------------------------------------
# SPAWNERS (/spawners)
# Per-mob kill progression unlocks one regular spawner for each mob.
# A spawner is unlocked once the player has killed <required-kills> of
# that entity, then bought directly from /spawners with Sky Tokens.
# spawn-count / spawn-delay-ticks are applied to the placed spawner block
# (fewer ticks = a faster cycle).
# --------------------------------------------------------------------------
spawners:
  # Anti-farming: kills above this per rolling minute do not count.
  kill-cap-per-minute: 120
  # Reward for killing a mob produced by a CoreMC spawner. Spawner kills
  # consume one slot in the kill cap, the same as wild kills.
  kill-rewards:
    chance: 0.75
    money: 3
    sky-tokens: 1
    island-xp: 2

  # Mob-specific rare drops unlock after sustained kills on each spawner lane.
  # The enchanted version is a 1-in-10 upgrade of a normal rare drop.
  rare-drops:
    unlock-kills: 1000
    chance: 0.10
    enchanted-chance: 0.10
    base-value: 500
    value-per-lane: 100
    enchanted-multiplier: 50
  zombie:
    unlock-kill-key: zombie
    display: "&2Zombie"
    entity: ZOMBIE
