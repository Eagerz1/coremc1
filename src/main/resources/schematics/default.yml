# ============================================================
#  CoreMC default island schematic
#
#  Hand-editable char-grid format:
#    palette : single character -> block type (' ' = air/skip)
#    origin  : paste corner, relative to the island centre (x/z)
#              and the island's base Y level (y)
#    spawn   : where the player lands after /is create or /is go,
#              relative to the island centre (x/z) and base Y (y)
#    layers  : bottom -> top; each layer is a list of equally long
#              rows (z direction); each character is one block
#              (x direction). Keep every row the same length and
#              every layer the same shape — rows are quoted so
#              leading/trailing spaces are preserved.
# ============================================================

name: default

origin:
  x: -6
  y: 0
  z: -6

spawn:
  x: 0.5
  y: 4.0
  z: 2.5

palette:
  b: BEDROCK
  c: COBBLESTONE
  d: DIRT
  g: GRASS_BLOCK
  L: OAK_LOG
  V: OAK_LEAVES
  C: CHEST
  T: TORCH

