# ============================================================
#  Collections — permanent, season-proof progression.
#
#  A Collection counts one authoritative progression action and
#  pays out at its own milestone tiers. Nothing in here is
#  seasonal: totals live in collections-data.yml and a season
#  reset never touches them.
#
#  Per collection:
#    category    mining, farming, fishing, slayer, generators,
#                spawners, companions, omnitools, discoveries,
#                events, seasonal
#    display     menu name (rendered in small caps)
#    icon        menu icon
#    action      the authoritative action that feeds it
#    keys        which subjects count (empty = every subject)
#    sources     optional source filter (world, generator, ...)
#    hidden      true = shown as ??? until the first one is found
#    hint        vague source hint for hidden entries (never odds)
#    milestones  ascending amounts, each with its own rewards
#
#  Reward types:
#    automatic (applied instantly, permanent):
#      recipe, unlock, cosmetic, title, tag, collection_tier, stat
#    hand-claimed (claimed in the GUI, parked safely if they
#    cannot be delivered):
#      item, coins, sky_tokens, credits, key, journey_xp
#
#  Collections for systems that live on other branches
#  (companions, omnitools) are configured and tested here; they
#  start filling the moment those systems post their events.
# ============================================================

settings:
  entries-per-page: 28
  announce-milestones: true

# ------------------------------------------------------------
#  Collection-locked recipes
# ------------------------------------------------------------
recipes:
  cobble_compressor:
    display: "Cobble Compressor"
    icon: STONE
    requires: {collection: cobblestone, tier: 3}
    ingredients:
      - COBBLESTONE:64
    result: STONE
    result-amount: 64
    description: "Compresses raw cobblestone without fuel."

  raw_iron_press:
    display: "Raw Iron Press"
    icon: IRON_BLOCK
    requires: {collection: iron, tier: 3}
    ingredients:
      - RAW_IRON:9
    result: RAW_IRON_BLOCK
    result-amount: 1
    description: "Presses raw iron into a block by hand."

  emerald_lens:
    display: "Emerald Lens"
    icon: SPYGLASS
    requires: {collection: emerald, tier: 2}
    ingredients:
      - EMERALD:4
      - GLASS:1
    result: SPYGLASS
    result-amount: 1
    description: "A prospector's glass cut from emerald."

  blaze_kiln:
    display: "Blaze Kiln"
    icon: BLAST_FURNACE
    requires: {collection: blaze, tier: 3}
    ingredients:
      - BLAZE_ROD:8
      - FURNACE:1
    result: BLAST_FURNACE
    result-amount: 1
    description: "Blaze rods fold heat into a blast furnace."

  anglers_charm:
    display: "Angler's Charm"
    icon: HEART_OF_THE_SEA
    requires: {collection: cod, tier: 4}
    ingredients:
      - NAUTILUS_SHELL:2
      - PRISMARINE_SHARD:16
    result: HEART_OF_THE_SEA
    result-amount: 1
    description: "The sea gives one back to a patient angler."

