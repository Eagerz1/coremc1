# ============================================================
#  CoreMC — spawners.yml
#  The mob spawner progression system.
#
#  GROUPS share a rare Relic; every MOB has its own unique drop,
#  used both to unlock later mobs and to upgrade spawners.
#
#  Variants (per mob, in order): normal -> advanced -> ancient
#  -> mythic. Each variant spawns mobs faster and in bigger
#  bursts; Mythic spawners also auto-kill their spawns (drops
#  are credited to the island owner — but no Slayer Essence:
#  only kills a player lands by hand pay that).
#
#  UPGRADES (/spawner upgrade opens a checklist GUI): each
#  variant costs a LIST of requirements, scaled by the stack
#  size (a 3x stack pays 3x everything):
#    {type: money,  amount: N}           coins (spent)
#    {type: kills,  amount: N}           lifetime mob kills (threshold)
#    {type: essence, essence: slayer, amount: N}   virtual essence (spent)
#    {type: drop,   amount: N, mob: id}  unique drops (spent; mob
#                                        defaults to the mob being
#                                        upgraded)
#  Resolution: a mob's own `upgrades:` beats the group's
#  `upgrade-overrides:` beats the global `upgrade-defaults:`.
#
#  Drop chances per player kill:
#    unique  = luck.base-chance + level * luck.bonus-per-level
#              (island luck, up to luck.max-level; default
#               0.1 -> 0.5, bought with coins via /spawner luck)
#    relic   = settings.relic-chance
#  Slayer Essence is NOT a chance drop any more — every mob a
#  player kills pays it deterministically (essences.yml).
#
#  Everything below is data — add groups, mobs, tweak costs and
#  chances freely. Broken entries refuse to load the system
#  (with every problem listed in the log) rather than half-work.
# ============================================================

settings:
  relic-chance: 0.01
  luck:
    base-chance: 0.1
    bonus-per-level: 0.1
    max-level: 4
    # Coins for luck level 1, 2, 3, 4.
    costs: [750, 2500, 7500, 20000]
  spawner:
    # Base spawn cycle; variants divide the delays by their rate.
    min-delay-ticks: 100
    max-delay-ticks: 400
    player-range: 16
    # How many spawners may be stacked on one block: sneak-click a
    # spawner onto an identical one to stack, sneak-break takes all.
    max-stack: 64

  # Mob stacking: spawns from registered spawners merge into counted
  # entities ("4x Pig"); killing a stack drops and credits the count.
  mob-stack:
    enabled: true
    radius: 5
    max: 1024

# Variant behaviour. rate divides the spawn delay, count is mobs
# per cycle, nearby-limit caps live mobs around the spawner.
variants:
  normal:   {rate: 1.0, count: 2, nearby-limit: 8,  auto-kill: false}
  advanced: {rate: 2.0, count: 3, nearby-limit: 12, auto-kill: false}
  ancient:  {rate: 3.0, count: 4, nearby-limit: 16, auto-kill: false}
  mythic:   {rate: 4.0, count: 6, nearby-limit: 24, auto-kill: true}

# Default upgrade requirements per variant (money + lifetime kills +
# Slayer Essence + the mob's own unique drop). Stacks pay per spawner.
upgrade-defaults:
  advanced:
    - {type: money, amount: 5000}
    - {type: kills, amount: 10000}
    - {type: essence, essence: slayer, amount: 20}
    - {type: drop, amount: 3}
  ancient:
    - {type: money, amount: 25000}
    - {type: kills, amount: 50000}
    - {type: essence, essence: slayer, amount: 60}
    - {type: drop, amount: 8}
  mythic:
    - {type: money, amount: 100000}
    - {type: kills, amount: 150000}
    - {type: essence, essence: slayer, amount: 200}
    - {type: drop, amount: 25}

