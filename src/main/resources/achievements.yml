# ============================================================
#  Achievements — permanent, season-proof milestones.
#
#  Achievement Points are PRESTIGE ONLY. They are never spent,
#  never traded and never converted into currency; they are a
#  lifetime score that survives every season reset.
#
#  Per achievement:
#    category     island, economy, combat, gathering,
#                 progression, mastery, social, events,
#                 seasonal, secret
#    display      menu name
#    description  one short line saying what to do
#    icon         menu icon
#    difficulty   common, rare, epic, legendary, prestige
#    points       optional override of the difficulty points
#    action       the authoritative action it listens to
#    keys         which subjects count (empty = every subject)
#    mode         total (sum), max (high-water mark),
#                 unique (distinct subjects)
#    requirement  how much is needed
#    secret       true = hidden as ??? until earned
#    seasonal     true = stamped with the season it was earned in
#    rewards      same reward types as collections.yml
#
#  Rewards that are items or currencies are claimed by hand in
#  the menu; unlocks, titles and cosmetics apply instantly.
# ============================================================

