# ======================================================
#  CoreMC — cosmetic chat tags
#
#  Rendered chat layout (see chat.yml 'format'):
#      <RANK> <TAG> Player: Message
#
#  The KEY of each entry is its STABLE ID. Ownership and the equipped
#  tag are persisted by that id on the player profile, never by display
#  name — so you can restyle 'display', 'name', 'lore', 'material' and
#  'slot' at any time without touching player data or losing purchases.
#
#  display       compact '&'-coded tag shown in chat (before the name)
#  name          GUI item name (defaults to 'display')
#  material      GUI icon
#  slot          -1 = auto-place into the next gui.slots entry
#  permission    permission that ALSO grants the tag ('' = none).
#                Default: coremc.tag.<id>. 'coremc.tag.*' grants all.
#  default-owned true = every player owns it from day one (starters).
#                Keep this false for paid/crate/event tags.
#  lore          extra GUI lore lines
#
#  Unlocks come from crates (crates.yml reward type TAG), the store,
#  events or staff: /tags grant <player> <id>. Admin grants persist
#  immediately (write-through to the profile file).
# ======================================================

